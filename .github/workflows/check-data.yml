name: Check device data

# Runs whenever someone changes the data file, so a typo can't break the live site.
on:
  push:
    paths: ["data/devices.json", "media/**", ".github/scripts/check_devices.py"]
  pull_request:
    paths: ["data/devices.json", "media/**", ".github/scripts/check_devices.py"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_devices.py
